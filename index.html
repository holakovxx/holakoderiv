<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expert Analysis Tool - Deriv V2</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }
        .container {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        h2 { color: #38bdf8; margin-bottom: 20px; }
        select, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            font-weight: bold;
        }
        select { background-color: #334155; color: #fff; }
        button { background-color: #22c55e; color: #fff; cursor: pointer; transition: 0.3s; }
        button:hover { opacity: 0.9; }
        button.stop { background-color: #ef4444; }
        .status { font-size: 14px; color: #94a3b8; margin-bottom: 15px; }
        .card {
            background-color: #0f172a;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }
        .tick-display { font-size: 32px; font-weight: bold; color: #38bdf8; margin: 10px 0; }
        .last-digit { font-size: 28px; font-weight: bold; color: #f59e0b; }
        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-top: 15px;
        }
        .digit-box {
            background-color: #334155;
            padding: 10px;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
        }
        .debug-box {
            font-size: 11px;
            color: #fbbf24;
            background: #000;
            padding: 8px;
            border-radius: 6px;
            margin-top: 10px;
            word-break: break-all;
            max-height: 80px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Expert Analysis Tool V2</h2>
    
    <select id="symbolSelect">
        <option value="R_10">Volatility 10 Index</option>
        <option value="1HZ10V">Volatility 10 (1s) Index</option>
        <option value="R_25" selected>Volatility 25 Index</option>
        <option value="1HZ25V">Volatility 25 (1s) Index</option>
        <option value="R_50">Volatility 50 Index</option>
        <option value="1HZ50V">Volatility 50 (1s) Index</option>
        <option value="R_75">Volatility 75 Index</option>
        <option value="1HZ75V">Volatility 75 (1s) Index</option>
        <option value="R_100">Volatility 100 Index</option>
    </select>

    <button id="connBtn" onclick="toggleConnection()">بدء التحليل المباشر</button>
    <div class="status" id="statusText">غير متصل بالحي</div>

    <div class="card">
        <div>السعر الحالي</div>
        <div class="tick-display" id="currentPrice">---</div>
        <div>آخر رقم (Last Digit): <span class="last-digit" id="lastDigit">-</span></div>
    </div>

    <div class="card">
        <h3>تحليل الأرقام (آخر 50 Ticks)</h3>
        <div class="grid" id="digitsGrid"></div>
    </div>

    <div class="debug-box" id="debugLog">جاري تجهيز النظام V2...</div>
</div>

<script>
    const APP_ID = "334155";
    let ws = null;
    let ticksHistory = [];

    function log(msg) {
        document.getElementById("debugLog").innerText = msg;
    }

    function toggleConnection() {
        if (ws) {
            ws.close();
            return;
        }

        const symbol = document.getElementById("symbolSelect").value;
        const statusText = document.getElementById("statusText");
        const connBtn = document.getElementById("connBtn");

        statusText.innerText = "جاري الاتصال...";
        log("فتح الاتصال المباشر...");
        ws = new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=${APP_ID}`);

        ws.onopen = () => {
            statusText.innerText = "متصل بنجاح - جاري جلب البيانات...";
            statusText.style.color = "#22c55e";
            connBtn.innerText = "إيقاف التحليل";
            connBtn.classList.add("stop");

            log("تم الاتصال. إرسال طلب Ticks...");

            ws.send(JSON.stringify({
                ticks: symbol
            }));
        };

        ws.onmessage = (msg) => {
            const data = JSON.parse(msg.data);

            if (data.error) {
                log("خطأ: " + data.error.message);
                return;
            }

            if (data.msg_type === 'tick' && data.tick) {
                log("تم استقبال Tick بنجاح!");
                const price = data.tick.quote;
                const formattedPrice = String(price);
                const lastDigitStr = formattedPrice.slice(-1);

                document.getElementById("currentPrice").innerText = formattedPrice;
                document.getElementById("lastDigit").innerText = lastDigitStr;

                ticksHistory.unshift(lastDigitStr);
                if (ticksHistory.length > 50) ticksHistory.pop();

                updateGrid();
            }
        };

        ws.onclose = () => {
            statusText.innerText = "غير متصل بالحي";
            statusText.style.color = "#94a3b8";
            connBtn.innerText = "بدء التحليل المباشر";
            connBtn.classList.remove("stop");
            log("تم إغلاق الاتصال.");
            ws = null;
        };

        ws.onerror = (err) => {
            statusText.innerText = "خطأ فـ الاتصال";
            statusText.style.color = "#ef4444";
            log("حدث خطأ فـ الشبكة.");
        };
    }

    function updateGrid() {
        const grid = document.getElementById("digitsGrid");
        grid.innerHTML = "";
        ticksHistory.forEach(digit => {
            const box = document.createElement("div");
            box.className = "digit-box";
            box.innerText = digit;
            grid.appendChild(box);
        });
    }
</script>

</body>
</html>
