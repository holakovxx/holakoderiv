<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expert Analysis Tool - Deriv V2</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }
        .container {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 {
            color: #38bdf8;
            margin-bottom: 20px;
        }
        select, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            font-weight: bold;
        }
        select {
            background-color: #334155;
            color: #ffffff;
        }
        button {
            background-color: #22c55e;
            color: #ffffff;
            cursor: pointer;
        }
        button.stop {
            background-color: #ef4444;
        }
        .status {
            font-size: 14px;
            margin: 10px 0;
            color: #94a3b8;
        }
        .card {
            background-color: #0f172a;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }
        .price {
            font-size: 24px;
            color: #38bdf8;
            font-weight: bold;
        }
        .digit {
            font-size: 20px;
            color: #f59e0b;
        }
        .error-log {
            background-color: #000;
            color: #f87171;
            padding: 8px;
            border-radius: 5px;
            font-size: 12px;
            margin-top: 10px;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Expert Analysis Tool V2</h2>
    
    <select id="symbolSelect">
        <option value="R_10">Volatility 10 Index</option>
        <option value="R_25" selected>Volatility 25 Index</option>
        <option value="R_50">Volatility 50 Index</option>
        <option value="R_75">Volatility 75 Index</option>
        <option value="R_100">Volatility 100 Index</option>
    </select>

    <button id="connBtn" onclick="toggleConnection()">بدء التحليل المباشر</button>
    <div class="status" id="statusText">غير متصل بالحي</div>

    <div class="card">
        <div>السعر الحالي</div>
        <div class="price" id="currentPrice">---</div>
        <div style="margin-top: 10px;">آخر رقم (Last Digit): <span class="digit" id="lastDigit">-</span></div>
    </div>

    <div class="card">
        <h3>تحليل الأرقام</h3>
        <div id="analysisResult">جاري تجهيز النظام...</div>
    </div>

    <div id="errorLog" class="error-log" style="display:none;"></div>
</div>

<script>
    let ws = null;
    let isConnected = false;
    let currentSubscriptionId = null;

    function toggleConnection() {
        if (isConnected) {
            disconnect();
        } else {
            connect();
        }
    }

    function connect() {
        const statusText = document.getElementById('statusText');
        const connBtn = document.getElementById('connBtn');
        const errorLog = document.getElementById('errorLog');

        errorLog.style.display = 'none';
        statusText.innerText = "جاري الاتصال بالسيرفر...";

        ws = new WebSocket('wss://ws.derivws.com/websockets/v3?app_id=1089');

        ws.onopen = function () {
            isConnected = true;
            statusText.innerText = "متصل بنجاح - جلب البيانات...";
            statusText.style.color = "#22c55e";
            connBtn.innerText = "إيقاف التحليل";
            connBtn.classList.add('stop');

            subscribeToSymbol();
        };

        ws.onmessage = function (msg) {
            const data = JSON.parse(msg.data);

            if (data.error) {
                errorLog.style.display = 'block';
                errorLog.innerText = "خطأ: " + data.error.message;
                return;
            }

            if (data.tick) {
                const price = data.tick.quote;
                const priceStr = price.toFixed(data.tick.pip_size || 2);
                const lastDigit = priceStr.charAt(priceStr.length - 1);

                document.getElementById('currentPrice').innerText = priceStr;
                document.getElementById('lastDigit').innerText = lastDigit;
                document.getElementById('analysisResult').innerText = "تم استلام السعر وتحديث آخر رقم بنجاح!";
            }
        };

        ws.onerror = function () {
            statusText.innerText = "حدث خطأ في الاتصال";
            statusText.style.color = "#ef4444";
            disconnect();
        };

        ws.onclose = function () {
            disconnect();
        };
    }

    function subscribeToSymbol() {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        
        const symbol = document.getElementById('symbolSelect').value;
        
        if (currentSubscriptionId) {
            ws.send(JSON.stringify({ forget: currentSubscriptionId }));
        }

        ws.send(JSON.stringify({
            ticks: symbol,
            subscribe: 1
        }));
    }

    document.getElementById('symbolSelect').addEventListener('change', function() {
        if (isConnected) {
            subscribeToSymbol();
        }
    });

    function disconnect() {
        if (ws) {
            ws.close();
            ws = null;
        }
        isConnected = false;
        currentSubscriptionId = null;
        document.getElementById('statusText').innerText = "غير متصل بالحي";
        document.getElementById('statusText').style.color = "#94a3b8";
        const connBtn = document.getElementById('connBtn');
        connBtn.innerText = "بدء التحليل المباشر";
        connBtn.classList.remove('stop');
    }
</script>

</body>
</html>
