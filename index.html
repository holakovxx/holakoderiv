<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expert Analysis Tool - Deriv V2</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }
        .container {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 { color: #38bdf8; margin-bottom: 20px; }
        select, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            font-weight: bold;
        }
        select { background-color: #334155; color: #ffffff; }
        button { background-color: #22c55e; color: #ffffff; cursor: pointer; }
        button.stop { background-color: #ef4444; }
        .status { font-size: 14px; margin: 10px 0; color: #94a3b8; }
        .card {
            background-color: #0f172a;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }
        .price { font-size: 24px; color: #38bdf8; font-weight: bold; }
        .digit { font-size: 20px; color: #f59e0b; }
        .error-log {
            background-color: #000;
            color: #f87171;
            padding: 8px;
            border-radius: 5px;
            font-size: 12px;
            margin-top: 10px;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Expert Analysis Tool V2</h2>

    <select id="symbolSelect">
        <optgroup label="Volatility">
            <option value="R_10">Volatility 10 Index</option>
            <option value="R_25" selected>Volatility 25 Index</option>
            <option value="R_50">Volatility 50 Index</option>
            <option value="R_75">Volatility 75 Index</option>
            <option value="R_100">Volatility 100 Index</option>
        </optgroup>
        <optgroup label="Volatility (1s)">
            <option value="1HZ10V">Volatility 10 (1s) Index</option>
            <option value="1HZ25V">Volatility 25 (1s) Index</option>
            <option value="1HZ50V">Volatility 50 (1s) Index</option>
            <option value="1HZ75V">Volatility 75 (1s) Index</option>
            <option value="1HZ100V">Volatility 100 (1s) Index</option>
        </optgroup>
    </select>

    <button id="connBtn" onclick="toggleConnection()">بدء التحليل المباشر</button>
    <div class="status" id="statusText">غير متصل بالحي</div>

    <div class="card">
        <div>السعر الحالي</div>
        <div class="price" id="currentPrice">---</div>
        <div style="margin-top: 10px;">آخر رقم (Last Digit): <span class="digit" id="lastDigit">-</span></div>
    </div>

    <div class="card">
        <h3>تحليل الأرقام</h3>
        <div id="analysisResult">جاري تجهيز النظام...</div>
    </div>

    <div id="errorLog" class="error-log" style="display:none;"></div>
</div>

<script>
    // عدّل هاد الرابط بعد ما ترفع الـ proxy:
    // محلياً:  ws://localhost:3000
    // على Render/Railway...:  wss://YOUR-PROXY-URL
    const PROXY_URL = 'wss://YOUR-PROXY-URL';

    let ws = null;
    let isConnected = false;
    let currentSymbol = "R_25";

    function toggleConnection() {
        isConnected ? disconnect() : connect();
    }

    function resetUI(message) {
        const connBtn = document.getElementById('connBtn');
        connBtn.innerText = "بدء التحليل المباشر";
        connBtn.classList.remove('stop');
        document.getElementById('statusText').innerText = message;
        document.getElementById('currentPrice').innerText = "---";
        document.getElementById('lastDigit').innerText = "-";
        document.getElementById('analysisResult').innerText = "جاري تجهيز النظام...";
    }

    function showError(text) {
        const errorLog = document.getElementById('errorLog');
        errorLog.style.display = 'block';
        errorLog.innerText = text;
    }

    function connect() {
        const statusText = document.getElementById('statusText');
        const connBtn = document.getElementById('connBtn');
        document.getElementById('errorLog').style.display = 'none';
        statusText.style.color = "#94a3b8";
        statusText.innerText = "جاري الاتصال بالـ proxy...";

        ws = new WebSocket(PROXY_URL);

        ws.onopen = function () {
            isConnected = true;
            statusText.innerText = "متصل بنجاح - جلب البيانات...";
            statusText.style.color = "#22c55e";
            connBtn.innerText = "إيقاف التحليل";
            connBtn.classList.add('stop');

            currentSymbol = document.getElementById('symbolSelect').value;
            sendSubscription();
        };

        ws.onmessage = function (msg) {
            const data = JSON.parse(msg.data);
            console.log(data); // للتشخيص: شوف شكل الرسائل الحقيقي من الـ API

            if (data.error) {
                showError("خطأ من السيرفر: " + data.error.message);
                return;
            }

            if (data.tick) {
                const price = data.tick.quote;
                const priceStr = price.toFixed(data.tick.pip_size || 2);
                const lastDigit = priceStr.charAt(priceStr.length - 1);

                document.getElementById('currentPrice').innerText = priceStr;
                document.getElementById('lastDigit').innerText = lastDigit;
                document.getElementById('analysisResult').innerText = "تم استلام السعر وتحديث Last Digit بنجاح.";
            }
        };

        ws.onerror = function () {
            statusText.innerText = "خطأ في الاتصال بالـ proxy";
            statusText.style.color = "#ef4444";
        };

        ws.onclose = function () {
            const wasConnected = isConnected;
            isConnected = false;
            ws = null;
            resetUI(wasConnected ? "انقطع الاتصال" : "تعذر الاتصال بالـ proxy");
            document.getElementById('statusText').style.color = "#ef4444";
        };
    }

    function sendSubscription() {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        ws.send(JSON.stringify({ forget_all: "ticks" }));
        ws.send(JSON.stringify({ ticks: currentSymbol, subscribe: 1 }));
    }

    document.getElementById('symbolSelect').addEventListener('change', function () {
        currentSymbol = this.value;
        if (isConnected) sendSubscription();
    });

    function disconnect() {
        if (ws) {
            ws.onclose = null;
            ws.close();
            ws = null;
        }
        isConnected = false;
        resetUI("غير متصل بالحي");
    }
</script>

</body>
</html>
